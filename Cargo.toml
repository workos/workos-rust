# @oagen-ignore-file
[package]
name = "workos"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Official Rust SDK for the WorkOS API"
license = "MIT"
repository = "https://github.com/workos/workos-rust"
homepage = "https://workos.com"
documentation = "https://docs.rs/workos"
readme = "README.md"
authors = ["WorkOS <sdk@workos.com>"]
keywords = ["workos", "sso", "authentication", "authkit", "sdk"]
categories = ["api-bindings", "authentication"]
exclude = [
    "tests/**",
    "script/**",
    ".github/**",
    "release-please-config.json",
    "renovate.json",
    "CHANGELOG.md",
]

[features]
default = ["reqwest", "rustls-tls"]
# Bundles the built-in `reqwest` HTTP transport. Disable to plug in your own
# `HttpTransport` impl (e.g. for WASM or to share a request pipeline with the
# rest of your app).
reqwest = ["dep:reqwest"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
futures = "0.3"
http = "1"
async-trait = "0.1"
bytes = "1"
# Hand-maintained helper layer (src/helpers/*).
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
subtle = "2.5"
jsonwebtoken = "9"
url = "2.5"
hex = "0.4"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[package.metadata.docs.rs]
features = ["rustls-tls"]
rustdoc-args = ["--cfg", "docsrs"]
