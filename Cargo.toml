# @oagen-ignore-file
[package]
name = "workos"
version = "3.5.0"
edition = "2024"
rust-version = "1.88"
description = "Official Rust SDK for the WorkOS API"
license = "MIT"
repository = "https://github.com/workos/workos-rust"
homepage = "https://workos.com"
documentation = "https://docs.rs/workos"
readme = "README.md"
authors = ["WorkOS <sdk@workos.com>"]
keywords = ["workos", "sso", "authentication", "authkit", "sdk"]
categories = ["api-bindings", "authentication"]
exclude = [
    "tests/**",
    "script/**",
    ".github/**",
    "release-please-config.json",
    "renovate.json",
    "CHANGELOG.md",
]

[features]
default = ["rustls-tls", "helpers"]
helpers = ["dep:aws-lc-rs", "dep:jsonwebtoken", "dep:base64", "dep:url", "dep:hex"]
# Opt in to Web Crypto randomness for API-only wasm32-unknown-unknown clients.
wasm-js = ["getrandom/wasm_js"]
# Pick a TLS backend. Both pull in the bundled `reqwest` transport; disable
# default features and supply your own `HttpTransport` impl (e.g. for WASM or
# to share a request pipeline with the rest of your app) instead.
native-tls = ["dep:reqwest", "reqwest/native-tls"]
rustls-tls = ["dep:reqwest", "reqwest/rustls-tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
# Retained because `HttpTransport` is consumed as `Arc<dyn HttpTransport>`,
# and native AFIT (edition 2024) is not dyn-compatible.
async-trait = "0.1"
bytes = "1"
# Hand-maintained helper layer (src/helpers/*). All crypto (AES-256-GCM,
# HMAC-SHA256, SHA-256, helper CSPRNG, constant-time compares, and JWT signature
# verification through `jsonwebtoken`) goes through aws-lc-rs so the SDK links
# exactly one cryptography library when helpers are enabled.
base64 = { version = "0.22", optional = true }
url = { version = "2.5", optional = true }
hex = { version = "0.4", optional = true }
aws-lc-rs = { version = "1", optional = true }
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"], optional = true }
getrandom = "0.3.4"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[package.metadata.docs.rs]
features = ["rustls-tls"]
rustdoc-args = ["--cfg", "docsrs"]
