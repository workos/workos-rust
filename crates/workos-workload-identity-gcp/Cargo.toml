[package]
name = "workos-workload-identity-gcp"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "GCP metadata server identity token provider for WorkOS workload identity federation"
license = "MIT"
repository = "https://github.com/workos/workos-rust"
homepage = "https://workos.com"
documentation = "https://docs.rs/workos-workload-identity-gcp"
readme = "README.md"
authors = ["WorkOS <sdk@workos.com>"]
keywords = ["workos", "workload-identity", "oidc", "gcp"]
categories = ["authentication"]

[dependencies]
# Only for the `IdentityTokenProvider` trait. Caret range: any release of the
# same major from the lower bound up. Every `workos` release rewrites the
# lower bound to its own version (`extra-files` in release-please-config.json).
# Until the first release that contains `workos::workload_identity`, 3.6.0 is
# a placeholder: do not publish this crate while it says 3.6.0.
workos = { version = "3.6.0", path = "../..", default-features = false }
# The metadata server is plain HTTP on a link-local address, so no TLS backend
# is enabled here and none is forced on the application.
reqwest = { version = "0.12", default-features = false }
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
