name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-please
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # release-please owns tag + GitHub Release creation (no
  # skip-github-release). Because it tags every release inside its own run
  # — before it computes the next release PR — it always knows the previous
  # release boundary, so it never regenerates the changelog from the start
  # of history or proposes a spurious major bump. This job is kept minimal
  # so nothing downstream (changelog enrichment, release notes) can fail it.
  #
  # The repo is a release-please manifest monorepo: `workos` at the root plus
  # the provider crates under `crates/`, each with its own release PR and tag.
  # The un-prefixed `release_created` and `tag_name` outputs belong to the root
  # package (`workos`) only; every other package's outputs are prefixed with
  # its path.
  #
  # Settings in release-please-config.json that keep the packages independent:
  # - `exclude-paths: ["crates"]` on the root package. release-please gives the
  #   root package every commit, so without it a provider-only commit would
  #   also release `workos`. A commit is skipped only when every file it
  #   changes is under `crates/`: one that also changes a root file, such as
  #   `Cargo.lock`, still counts for `workos`.
  # - `bootstrap-sha` (the 3.6.0 release commit). Until every provider crate
  #   has its first release, release-please reads history back to this commit
  #   and no further. Older history has empty commits, one with
  #   `Release-As: 3.4.1`, that would otherwise set each provider's first
  #   version and changelog. Ignored once all four packages have a release.
  # - `initial-version: "0.1.0"` on each provider crate states the first
  #   version. The `rust` release type already starts at 0.1.0 and does not
  #   read the key, so it is there for readers and for other release types.
  #
  # To force a version, set `release-as` on that package in
  # release-please-config.json and remove it after the release. Do not push an
  # empty `Release-As:` commit: release-please applies an empty commit to every
  # provider crate, and `exclude-paths` keeps it away from `workos`.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      prs: ${{ steps.release.outputs.prs }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      github_actions_release_created: ${{ steps.release.outputs['crates/workos-workload-identity-github-actions--release_created'] }}
      gcp_release_created: ${{ steps.release.outputs['crates/workos-workload-identity-gcp--release_created'] }}
      aws_release_created: ${{ steps.release.outputs['crates/workos-workload-identity-aws--release_created'] }}
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.generate-token.outputs.token }}

  # While a release PR is open, enrich it before it merges. Runs as its
  # own job (gated on a PR existing) so a failure here can never block the
  # release or the crates.io publish that depends on release-please.
  #
  # One run per release PR that release-please created or updated: `workos`
  # and each provider crate have their own.
  enrich-release-pr:
    name: Enrich ${{ matrix.pr.headBranchName }}
    needs: release-please
    if: needs.release-please.outputs.prs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.release-please.outputs.prs) }}
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout release PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.pr.headBranchName }}
          token: ${{ steps.generate-token.outputs.token }}

      # Inline pending changelog fragments under the version heading
      # release-please just wrote in CHANGELOG.md. For PRs that have a
      # fragment (the autogen flow always writes one), drop the line
      # release-please rendered and use the fragment instead. For PRs
      # without a fragment (typical for human-authored PRs), keep what
      # release-please wrote. Fragments are deleted in the same commit.
      # Idempotent: if no fragments exist, skip silently.
      #
      # Only for the `workos` release PR: the fragments describe the SDK and
      # go into the root CHANGELOG.md. The provider crates' release PRs keep
      # the changelog release-please wrote.
      - name: Inline rich changelog fragments
        if: matrix.pr.headBranchName == 'release-please--branches--main--components--workos'
        env:
          PR_TITLE: ${{ matrix.pr.title }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          fragments=(.changelog-pending/*.md)
          if [ ${#fragments[@]} -eq 0 ]; then
            echo "No .changelog-pending fragments; leaving release-please CHANGELOG.md as-is."
            exit 0
          fi

          VERSION=$(echo "$PR_TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          export VERSION

          python3 - <<'PY'
          import os, re, pathlib, glob

          version = os.environ["VERSION"]

          # Load fragments + extract the PR number each one covers from
          # its top-line "* [#NN](url) ...".
          fragments = []
          covered = set()
          for path in sorted(glob.glob(".changelog-pending/*.md")):
              body = pathlib.Path(path).read_text().rstrip()
              m = re.search(r'\[#(\d+)\]', body)
              if m:
                  covered.add(m.group(1))
              fragments.append(body)

          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text()
          section_re = re.compile(
              r'(^## \[' + re.escape(version) + r'\][^\n]*\n)(.*?)(?=^## |\Z)',
              re.MULTILINE | re.DOTALL,
          )
          match = section_re.search(text)
          if not match:
              raise SystemExit(f"Could not find '## [{version}]' heading in CHANGELOG.md")
          heading, body = match.group(1), match.group(2)

          # Drop any release-please line that references a PR we have a
          # fragment for.
          kept = []
          for line in body.split("\n"):
              if any(pr in covered for pr in re.findall(r'\[#(\d+)\]', line)):
                  continue
              kept.append(line)
          filtered = "\n".join(kept)

          # Collapse "### Heading\n(blank lines)\n" with nothing under
          # it. Run repeatedly until stable in case of stacked empties.
          empty_section = re.compile(
              r'^### [^\n]*\n(?:\s*\n)*(?=^### |\Z)',
              re.MULTILINE,
          )
          while True:
              new = empty_section.sub('', filtered)
              if new == filtered:
                  break
              filtered = new
          filtered = filtered.strip()

          parts = []
          if filtered:
              parts.append(filtered)
          parts.extend(fragments)
          new_body = "\n\n".join(parts)

          new_text = text[:match.start()] + heading + "\n" + new_body + "\n\n" + text[match.end():]
          changelog.write_text(new_text)
          PY

          git config user.name "workos-sdk-automation[bot]"
          git config user.email "255426317+workos-sdk-automation[bot]@users.noreply.github.com"
          git rm .changelog-pending/*.md
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: inline release notes from .changelog-pending"
          git push

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: stable
          components: cargo

      # Every release PR needs this: release-please bumps the version in the
      # released crate's Cargo.toml, and for a provider crate it does not touch
      # the workspace Cargo.lock at all. `cargo publish --locked` fails on a
      # lockfile that is out of date.
      - name: Update lockfile
        run: |
          cargo update --workspace
          git config user.name "workos-sdk-automation[bot]"
          git config user.email "255426317+workos-sdk-automation[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --staged --quiet || git commit -m "chore: update Cargo.lock"
          git push

  # After release-please tags the `workos` release and creates the GitHub
  # Release, replace its body with the rich section from CHANGELOG.md
  # (release-please writes only its terse default rendering). Cosmetic-only:
  # never fails the release if the section can't be found. Provider crate
  # releases keep release-please's notes.
  update-release-notes:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set rich release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { found=1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ -s /tmp/release-notes.md ]; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            echo "No CHANGELOG.md body for $TAG; keeping release-please default notes."
          fi

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: stable
          components: cargo

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --locked -p workos
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # One publish job per provider crate, each gated on that crate's own release.
  # The provider crates depend on `workos`, so each job is ordered after the
  # `workos` publish: when both are released in the same run, the `workos`
  # version the crate was built against is on crates.io first. When `workos`
  # was not released in this run its publish job is skipped, and the provider
  # job still runs.

  publish-github-actions:
    name: Publish workos-workload-identity-github-actions
    needs: [release-please, publish]
    if: >-
      !cancelled()
      && needs.release-please.outputs.github_actions_release_created == 'true'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: stable
          components: cargo

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --locked -p workos-workload-identity-github-actions
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-gcp:
    name: Publish workos-workload-identity-gcp
    needs: [release-please, publish]
    if: >-
      !cancelled()
      && needs.release-please.outputs.gcp_release_created == 'true'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: stable
          components: cargo

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --locked -p workos-workload-identity-gcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-aws:
    name: Publish workos-workload-identity-aws
    needs: [release-please, publish]
    if: >-
      !cancelled()
      && needs.release-please.outputs.aws_release_created == 'true'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: stable
          components: cargo

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --locked -p workos-workload-identity-aws
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
