name: CI

on:
  push:
    branches:
      - 'main'
  pull_request: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.88.0
          components: cargo

      # Release PRs get their Cargo.lock from a follow-up commit (see
      # release-please.yml). Publishing uses --locked, so a release PR whose
      # lockfile has not caught up must not look green.
      - name: Check Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Run Tests
        run: |
          cargo build --verbose
          cargo test --verbose

      # The check that keeps a provider crate from being published before the
      # `workos` release it needs (see release-please.yml).
      - name: Test the provider release check
        run: script/test-check-provider-release

  # The workload identity provider crates are released one at a time, so each
  # is built and tested from its own directory, with only its own features.
  test-providers:
    name: Test ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - workos-workload-identity-github-actions
          - workos-workload-identity-gcp
          - workos-workload-identity-aws
    defaults:
      run:
        shell: bash
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.88.0
          components: cargo

      # On this crate's own release PR only. Merging it tags the release, and
      # the publish job then refuses a crate whose `workos` requirement is not
      # a published `workos` release with workload identity (see
      # release-please.yml). So that PR must not look green before then.
      - name: Check the workos release this crate needs
        if: github.head_ref == format('release-please--branches--main--components--{0}', matrix.crate)
        run: ../../script/check-provider-release ${{ matrix.crate }}

      - name: Run Tests
        run: |
          cargo build --verbose
          cargo test --verbose
