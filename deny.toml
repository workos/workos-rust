# cargo-deny configuration for workos-rust.
# Run with: cargo deny check
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin timing side-channel in RSA private-key operations (decryption/signing).
    # Pulled in via jsonwebtoken's rust_crypto backend; this crate only performs
    # public-key RS256 signature verification against JWKS, so no private-key
    # code path is reachable. No patched release exists.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for public-key signature verification only" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
